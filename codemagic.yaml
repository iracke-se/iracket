workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - iracket_upload
      flutter: 3.35.5
      groups:
        - firebase
        - app_env
      vars:
        PACKAGE_NAME: "com.iracket.app"
    scripts:
      - name: Restore Firebase config files
        script: |
          echo "$ANDROID_FIREBASE_SECRET" | base64 --decode > flutter-app/android/app/google-services.json
          echo "$IOS_FIREBASE_SECRET" | base64 --decode > flutter-app/ios/Runner/GoogleService-Info.plist
      - name: Pre-build
        script: |
          cd flutter-app
          flutter pub get
          flutter pub run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build AAB
        script: |
          cd flutter-app
          flutter build appbundle --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --dart-define=LARAVEL_URL=$LARAVEL_URL \
            --dart-define=API_URL=$API_URL \
            --dart-define=BEARER_TOKEN=$BEARER_TOKEN \
            --dart-define=ENV=$ENV
    artifacts:
      - flutter-app/build/**/outputs/bundle/**/*.aab
      - flutter-app/build/**/outputs/apk/**/*.apk
      - flutter-app/build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - andrej.gosevski03@gmail.com
        notify:
          success: true
          failure: true

  combined-workflow:
    name: Android + iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      android_signing:
        - iracket_upload
      flutter: 3.35.5
      xcode: latest
      cocoapods: default
      groups:
        - firebase
        - app_env
      vars:
        PACKAGE_NAME: "com.iracket.app"
        BUNDLE_ID: "com.iracket.app"
        APP_STORE_APPLE_ID: 6772827377
    scripts:
      - name: Restore Firebase config files
        script: |
          echo "$ANDROID_FIREBASE_SECRET" | base64 --decode > flutter-app/android/app/google-services.json
          echo "$IOS_FIREBASE_SECRET" | base64 --decode > flutter-app/ios/Runner/GoogleService-Info.plist
      - name: Pre-build
        script: |
          cd flutter-app
          flutter pub get
          flutter pub run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Set up iOS code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Install pods
        script: |
          cd flutter-app/ios
          pod install
      - name: Set iOS build number
        script: |
          cd flutter-app/ios
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build Android AAB
        script: |
          cd flutter-app
          flutter build appbundle --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --dart-define=LARAVEL_URL=$LARAVEL_URL \
            --dart-define=API_URL=$API_URL \
            --dart-define=BEARER_TOKEN=$BEARER_TOKEN \
            --dart-define=ENV=$ENV
      - name: Build iOS IPA
        script: |
          cd flutter-app
          flutter build ipa --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$(($BUILD_NUMBER + 1)) \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=LARAVEL_URL=$LARAVEL_URL \
            --dart-define=API_URL=$API_URL \
            --dart-define=BEARER_TOKEN=$BEARER_TOKEN \
            --dart-define=ENV=$ENV
    artifacts:
      - flutter-app/build/**/outputs/bundle/**/*.aab
      - flutter-app/build/**/outputs/apk/**/*.apk
      - flutter-app/build/**/outputs/**/mapping.txt
      - flutter-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter-app/flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - andrej.gosevski03@gmail.com
        notify:
          success: true
          failure: true

