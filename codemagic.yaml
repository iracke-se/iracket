workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - iracket_upload
      flutter: 3.35.5
      groups:
        - firebase
        - app_env
      vars:
        PACKAGE_NAME: "com.iracket.app"
    scripts:
      - name: Restore Firebase config files
        script: |
          echo "$ANDROID_FIREBASE_SECRET" | base64 --decode > flutter-app/android/app/google-services.json
          echo "$IOS_FIREBASE_SECRET" | base64 --decode > flutter-app/ios/Runner/GoogleService-Info.plist
      - name: Pre-build
        script: |
          cd flutter-app
          flutter pub get
          flutter pub run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Set up Android key.properties
        script: |
          cat > "$CM_BUILD_DIR/flutter-app/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build AAB
        script: |
          cd flutter-app
          flutter build appbundle --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=LARAVEL_URL=$LARAVEL_URL \
            --dart-define=API_URL=$API_URL \
            --dart-define=BEARER_TOKEN=$BEARER_TOKEN \
            --dart-define=ENV=$ENV
    artifacts:
      - flutter-app/build/**/outputs/bundle/**/*.aab
      - flutter-app/build/**/outputs/apk/**/*.apk
      - flutter-app/build/**/outputs/**/mapping.txt
    publishing:
      scripts:
        # Google Play publish is done as a script (not the declarative
        # google_play integration) so that a missing/unconfigured service
        # account never fails the build — the AAB is already built and kept as
        # an artifact. ignore_failure keeps the build green even if the upload
        # itself errors (e.g. no initial release yet). See docs/GOOGLE_PLAY_SETUP.md.
        - name: Publish to Google Play (only if a service account is configured)
          ignore_failure: true
          script: |
            if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
              echo "GCLOUD_SERVICE_ACCOUNT_CREDENTIALS not set — skipping Google Play publish."
              exit 0
            fi
            AAB=$(find "$CM_BUILD_DIR/flutter-app/build" -name "*.aab" | head -1)
            if [ -z "$AAB" ]; then
              echo "No .aab artifact found — skipping Google Play publish."
              exit 0
            fi
            echo "Publishing $AAB to Google Play (production track)…"
            echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > "$CM_BUILD_DIR/gcloud_sa.json"
            fastlane supply \
              --package_name "$PACKAGE_NAME" \
              --aab "$AAB" \
              --track production \
              --json_key "$CM_BUILD_DIR/gcloud_sa.json" \
              --skip_upload_metadata true \
              --skip_upload_images true \
              --skip_upload_screenshots true
      email:
        recipients:
          - andrej.gosevski03@gmail.com
        notify:
          success: true
          failure: true

  combined-workflow:
    name: Android + iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "i-racket AB"
    environment:
      android_signing:
        - iracket_upload
      flutter: 3.35.5
      xcode: latest
      cocoapods: default
      groups:
        - firebase
        - app_env
      vars:
        PACKAGE_NAME: "com.iracket.app"
        BUNDLE_ID: "com.iracket.app"
        APP_STORE_APPLE_ID: 6772827377
    scripts:
      - name: Restore Firebase config files
        script: |
          echo "$ANDROID_FIREBASE_SECRET" | base64 --decode > flutter-app/android/app/google-services.json
          echo "$IOS_FIREBASE_SECRET" | base64 --decode > flutter-app/ios/Runner/GoogleService-Info.plist
      - name: Pre-build
        script: |
          cd flutter-app
          flutter pub get
          flutter pub run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Set up iOS code signing
        script: |
          set -e
          keychain initialize
          echo "===== fetch-signing-files (verbose) ====="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create \
            --verbose
          keychain add-certificates
          echo "===== signing identities in keychain after add-certificates ====="
          security find-identity -v -p codesigning || true
          xcode-project use-profiles
      - name: Install pods
        script: |
          cd flutter-app/ios
          pod install
      - name: Set iOS build number
        script: |
          cd flutter-app/ios
          agvtool new-version -all $(($PROJECT_BUILD_NUMBER + 1))
      - name: Set up Android key.properties
        script: |
          cat > "$CM_BUILD_DIR/flutter-app/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build Android AAB
        script: |
          cd flutter-app
          flutter build appbundle --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=LARAVEL_URL=$LARAVEL_URL \
            --dart-define=API_URL=$API_URL \
            --dart-define=BEARER_TOKEN=$BEARER_TOKEN \
            --dart-define=ENV=$ENV
      - name: Build iOS IPA
        script: |
          cd flutter-app
          flutter build ipa --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$(($PROJECT_BUILD_NUMBER + 1)) \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=LARAVEL_URL=$LARAVEL_URL \
            --dart-define=API_URL=$API_URL \
            --dart-define=BEARER_TOKEN=$BEARER_TOKEN \
            --dart-define=ENV=$ENV
    artifacts:
      - flutter-app/build/**/outputs/bundle/**/*.aab
      - flutter-app/build/**/outputs/apk/**/*.apk
      - flutter-app/build/**/outputs/**/mapping.txt
      - flutter-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter-app/flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      scripts:
        # Google Play publish is done as a script (not the declarative
        # google_play integration) so a missing/unconfigured service account
        # never fails the build — the iOS TestFlight publish and the built
        # artifacts are unaffected. ignore_failure keeps the build green even if
        # the upload itself errors. See docs/GOOGLE_PLAY_SETUP.md.
        - name: Publish to Google Play (only if a service account is configured)
          ignore_failure: true
          script: |
            if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
              echo "GCLOUD_SERVICE_ACCOUNT_CREDENTIALS not set — skipping Google Play publish."
              exit 0
            fi
            AAB=$(find "$CM_BUILD_DIR/flutter-app/build" -name "*.aab" | head -1)
            if [ -z "$AAB" ]; then
              echo "No .aab artifact found — skipping Google Play publish."
              exit 0
            fi
            echo "Publishing $AAB to Google Play (production track)…"
            echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > "$CM_BUILD_DIR/gcloud_sa.json"
            fastlane supply \
              --package_name "$PACKAGE_NAME" \
              --aab "$AAB" \
              --track production \
              --json_key "$CM_BUILD_DIR/gcloud_sa.json" \
              --skip_upload_metadata true \
              --skip_upload_images true \
              --skip_upload_screenshots true
      email:
        recipients:
          - andrej.gosevski03@gmail.com
        notify:
          success: true
          failure: true

